# Hairpin NAT overlay: both agents sit on private-a behind nat-gw. They
# must reach each other via the gateway's public IP (hairpin DNAT).
# Many real NATs fail silently at hairpinning; this test verifies Pilot
# copes when its peer is "logically behind the same NAT."
#
# Subnet prefixes templated via NAT_PUB / NAT_PRV (two-octet form).
services:
  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    networks:
      public:
        ipv4_address: "${NAT_PUB:-192.0.2}.10"
    command: >
      pilot-rendezvous
      -registry-addr 0.0.0.0:9000
      -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080
      -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/public-stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  nat-gw:
    build:
      context: .
      dockerfile: Dockerfile.nat-gw
    hostname: nat-gw
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      NAT_MODE: "hairpin"
      PUBLIC_SUBNET: "${NAT_PUB:-192.0.2}"
      PRIVATE_SUBNET: "${NAT_PRV:-198.51.100}"
    networks:
      private-a:
        ipv4_address: "${NAT_PRV:-198.51.100}.2"
      public:
        ipv4_address: "${NAT_PUB:-192.0.2}.30"
    command: ["/bin/bash", "/nat-gw.sh"]

  agent-a:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-a
    depends_on:
      rendezvous: {condition: service_healthy}
      nat-gw: {condition: service_started}
    cap_add: [NET_ADMIN]
    networks:
      private-a:
        ipv4_address: "${NAT_PRV:-198.51.100}.20"
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
      NAT_PRV: "${NAT_PRV:-198.51.100}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        ip route del default 2>/dev/null || true
        ip route add default via $${NAT_PRV}.2
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-a -identity /root/.pilot/identity.json \
          -email agent-a@hairpin.test -listen :4000 -keepalive 5s -log-level info
    command: []

  agent-b:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-b
    depends_on:
      rendezvous: {condition: service_healthy}
      nat-gw: {condition: service_started}
    cap_add: [NET_ADMIN]
    networks:
      private-a:
        ipv4_address: "${NAT_PRV:-198.51.100}.21"
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
      NAT_PRV: "${NAT_PRV:-198.51.100}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        ip route del default 2>/dev/null || true
        ip route add default via $${NAT_PRV}.2
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-b -identity /root/.pilot/identity.json \
          -email agent-b@hairpin.test -listen :4000 -keepalive 5s -log-level info
    command: []

networks:
  public:
    driver: bridge
    ipam:
      config: [{subnet: "${NAT_PUB:-192.0.2}.0/24"}]
  private-a:
    driver: bridge
    ipam:
      config: [{subnet: "${NAT_PRV:-198.51.100}.0/24"}]
