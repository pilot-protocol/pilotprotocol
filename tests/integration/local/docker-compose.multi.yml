services:
  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.29.0}.10
    environment:
      PILOT_REGISTRY_NORATELIMIT: "1"
    command: >
      pilot-rendezvous
      -registry-addr 0.0.0.0:9000
      -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080
      -store /tmp/registry.json
      -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/public-stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  agent-a:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-a
    depends_on:
      rendezvous:
        condition: service_healthy
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.29.0}.20
    environment:
      PILOT_REGISTRY: "${PILOT_SUBNET_PREFIX:-172.29.0}.10:9000"
    command: >
      pilot-daemon
      -registry ${PILOT_SUBNET_PREFIX:-172.29.0}.10:9000
      -beacon ${PILOT_SUBNET_PREFIX:-172.29.0}.10:9001
      -hostname agent-a
      -identity /root/.pilot/identity.json
      -email agent-a@p2p.test
      -endpoint ${PILOT_SUBNET_PREFIX:-172.29.0}.20:4000
      -listen :4000
      -public
      -keepalive 5s
      -log-level info

  agent-b:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-b
    depends_on:
      rendezvous:
        condition: service_healthy
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.29.0}.21
    environment:
      PILOT_REGISTRY: "${PILOT_SUBNET_PREFIX:-172.29.0}.10:9000"
    command: >
      pilot-daemon
      -registry ${PILOT_SUBNET_PREFIX:-172.29.0}.10:9000
      -beacon ${PILOT_SUBNET_PREFIX:-172.29.0}.10:9001
      -hostname agent-b
      -identity /root/.pilot/identity.json
      -email agent-b@p2p.test
      -endpoint ${PILOT_SUBNET_PREFIX:-172.29.0}.21:4000
      -listen :4000
      -public
      -keepalive 5s
      -log-level info

  runner:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: runner
    depends_on:
      rendezvous:
        condition: service_healthy
      agent-a:
        condition: service_started
      agent-b:
        condition: service_started
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.29.0}.30
    environment:
      PILOT_SUBNET_PREFIX: "${PILOT_SUBNET_PREFIX:-172.29.0}"
    volumes:
      - ./results:/results
    command: ["/bin/bash", "/tests/test_p2p.sh"]

networks:
  pilot-p2p:
    driver: bridge
    ipam:
      config:
        - subnet: ${PILOT_SUBNET_PREFIX:-172.29.0}.0/24
