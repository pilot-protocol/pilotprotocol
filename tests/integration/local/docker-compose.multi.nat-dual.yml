# Dual-NAT overlay: both agents behind their own symmetric gateway.
# This is the canonical scenario where direct hole-punch fails for
# both sides and Pilot's beacon-relay must carry the data path.
#
#   agent-a --> nat-gw-a --> public ─┐
#                                    ├── rendezvous
#   agent-b --> nat-gw-b --> public ─┘
#
# Subnet prefixes templated via NAT_PUB / NAT_PRV_A / NAT_PRV_B
# (two-octet form). Parallel runners override to non-overlapping prefixes.
services:
  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    networks:
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.10"}
    command: >
      pilot-rendezvous -registry-addr 0.0.0.0:9000 -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080 -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/public-stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  nat-gw-a:
    build: {context: ., dockerfile: Dockerfile.nat-gw}
    hostname: nat-gw-a
    cap_add: [NET_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      NAT_MODE: "${NAT_MODE_A:-symmetric}"
      PUBLIC_SUBNET: "${NAT_PUB:-192.0.2}"
      PRIVATE_SUBNET: "${NAT_PRV_A:-198.51.100}"
    networks:
      private-a: {ipv4_address: "${NAT_PRV_A:-198.51.100}.2"}
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.30"}
    command: ["/bin/bash", "/nat-gw.sh"]

  nat-gw-b:
    build: {context: ., dockerfile: Dockerfile.nat-gw}
    hostname: nat-gw-b
    cap_add: [NET_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      NAT_MODE: "${NAT_MODE_B:-symmetric}"
      PUBLIC_SUBNET: "${NAT_PUB:-192.0.2}"
      PRIVATE_SUBNET: "${NAT_PRV_B:-203.0.113}"
    networks:
      private-b: {ipv4_address: "${NAT_PRV_B:-203.0.113}.2"}
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.31"}
    command: ["/bin/bash", "/nat-gw.sh"]

  agent-a:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-a
    depends_on:
      rendezvous: {condition: service_healthy}
      nat-gw-a: {condition: service_started}
    cap_add: [NET_ADMIN]
    networks:
      private-a: {ipv4_address: "${NAT_PRV_A:-198.51.100}.20"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
      NAT_PRV_A: "${NAT_PRV_A:-198.51.100}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        ip route del default 2>/dev/null || true
        ip route add default via $${NAT_PRV_A}.2
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-a -identity /root/.pilot/identity.json \
          -email agent-a@dual.test -listen :4000 -keepalive 5s -log-level info
    command: []

  agent-b:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-b
    depends_on:
      rendezvous: {condition: service_healthy}
      nat-gw-b: {condition: service_started}
    cap_add: [NET_ADMIN]
    networks:
      private-b: {ipv4_address: "${NAT_PRV_B:-203.0.113}.20"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
      NAT_PRV_B: "${NAT_PRV_B:-203.0.113}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        ip route del default 2>/dev/null || true
        ip route add default via $${NAT_PRV_B}.2
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-b -identity /root/.pilot/identity.json \
          -email agent-b@dual.test -listen :4000 -keepalive 5s -log-level info
    command: []

networks:
  public:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PUB:-192.0.2}.0/24"}]}
  private-a:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PRV_A:-198.51.100}.0/24"}]}
  private-b:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PRV_B:-203.0.113}.0/24"}]}
