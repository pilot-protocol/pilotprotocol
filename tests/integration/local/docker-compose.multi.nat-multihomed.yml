# Multi-homed agent: agent-a has two public interfaces (two different
# bridges, two different IPs). Peer can reach either. Tests whether
# Pilot handles multiple interfaces and which it selects.
#
# Subnet prefixes templated via NAT_PUB / NAT_PUB2 (two-octet form).
services:
  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    networks:
      public1: {ipv4_address: "${NAT_PUB:-192.0.2}.10"}
      public2: {ipv4_address: "${NAT_PUB2:-203.0.113}.10"}
    command: >
      pilot-rendezvous -registry-addr 0.0.0.0:9000 -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080 -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/public-stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  agent-a:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-a
    depends_on:
      rendezvous: {condition: service_healthy}
    networks:
      public1: {ipv4_address: "${NAT_PUB:-192.0.2}.20"}
      public2: {ipv4_address: "${NAT_PUB2:-203.0.113}.20"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
    command:
      - /bin/bash
      - -c
      - |
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-a -identity /root/.pilot/identity.json \
          -email agent-a@mh.test -endpoint $${NAT_PUB}.20:4000 -listen :4000 \
          -public -keepalive 5s -log-level info

  agent-b:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-b
    depends_on:
      rendezvous: {condition: service_healthy}
    networks:
      public1: {ipv4_address: "${NAT_PUB:-192.0.2}.21"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.10:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
    command:
      - /bin/bash
      - -c
      - |
        exec pilot-daemon \
          -registry $${NAT_PUB}.10:9000 -beacon $${NAT_PUB}.10:9001 \
          -hostname agent-b -identity /root/.pilot/identity.json \
          -email agent-b@mh.test -endpoint $${NAT_PUB}.21:4000 -listen :4000 \
          -public -keepalive 5s -log-level info

networks:
  public1:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PUB:-192.0.2}.0/24"}]}
  public2:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PUB2:-203.0.113}.0/24"}]}
