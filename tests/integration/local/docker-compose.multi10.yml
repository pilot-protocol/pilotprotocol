services:
  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.34.0}.10
    command: >
      pilot-rendezvous
      -registry-addr 0.0.0.0:9000
      -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080
      -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/public-stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  a1:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: a1
    depends_on:
      rendezvous:
        condition: service_healthy
    networks:
      pilot-p2p:
        ipv4_address: ${PILOT_SUBNET_PREFIX:-172.34.0}.21
    environment:
      PILOT_REGISTRY: "${PILOT_SUBNET_PREFIX:-172.34.0}.10:9000"
    command: >
      pilot-daemon
      -registry ${PILOT_SUBNET_PREFIX:-172.34.0}.10:9000
      -beacon ${PILOT_SUBNET_PREFIX:-172.34.0}.10:9001
      -hostname a1 -identity /root/.pilot/identity.json -email a1@p2p.test
      -endpoint ${PILOT_SUBNET_PREFIX:-172.34.0}.21:4000 -listen :4000 -public -keepalive 5s -log-level info

