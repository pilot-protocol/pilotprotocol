# Temporary: clean-machine onboarding check for a beta-channel release on
# every supported platform. Lives only on the verify/* branch.
name: verify-onboarding
on:
  push:
    branches: ['verify/**']
permissions:
  contents: read
jobs:
  onboard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rep: [1, 2, 3, 4, 5]
        version: [v1.13.9, v1.13.10-rc.2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Onboard from the beta channel
        run: bash .github/verify-onboarding.sh "${{ matrix.version }}"
